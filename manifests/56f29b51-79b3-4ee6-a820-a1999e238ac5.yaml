      # WIDGET 4: DROPDOWN FILTER (KONTROL)
      - widget_id: "cd-et30peel8d"
        title: "Filter Event Type"
        type: "dropdown_filter"
        alias: "df5" # URL parameter alias untuk Linking API (?params={"df5":"LLM_RESPONSE"})
        data_source_id: "843d3814-fda1-4bea-a94b-603fd3aa29af"
        data_source_name: "agent_events"
        dimension:
          field: "event_type"
          internal_field_id: "_event_type_"
        metric:
          field: "Record Count"
          internal_field_id: "datastudio_record_count_system_field_id_98323387"
        style:
          position: { x: 808, y: 0, width: 380, height: 40 }

      # WIDGET 5: TABEL EVENT AGENT
      - widget_id: "cd-bya47jdl8d"
        title: "Untitled Report Tabel"
        type: "table"
        data_source_id: "843d3814-fda1-4bea-a94b-603fd3aa29af"
        data_source_name: "agent_events"
        
        # SETUP DATA
        date_range_field: "timestamp"
        default_date_range: "Auto"
        dimensions:
          - field: "event_type"
            internal_field_id: "_event_type_"
            data_type: "Text"
          - field: "event_status"
            internal_field_id: "calc_j0l5kfel8d"
            data_type: "Text"
            is_calculated_field: true
            scope: "data_source"
          - field: "upper_event_type"
            internal_field_id: "qt_x31tpgel8d"
            data_type: "Text"
            is_calculated_field: true
            scope: "chart"
            formula: "UPPER(event_type)"
            internal_formula: "UPPER(t0._event_type_)"
        metrics:
          - field: "Record Count"
            internal_field_id: "datastudio_record_count_system_field_id_98323387"
            aggregation: "COUNT"
            formula: "COUNT(1)"
            display_format: "Integer"
        sort:
          field: "Record Count"
          order: "DESC"
        limit: 100
        sql_query: |
          SELECT 
            event_type,
            CASE WHEN event_type = 'TOOL_ERROR' THEN 'Error' ELSE 'Success' END AS event_status,
            UPPER(event_type) AS upper_event_type,
            COUNT(1) AS record_count
          FROM `devfest-workshop-479805.<DATASET>.agent_events`
          WHERE (@start_date IS NULL OR DATE(timestamp) BETWEEN @start_date AND @end_date)
            AND (@df5 IS NULL OR event_type = @df5)
          GROUP BY 1, 2, 3
          ORDER BY 4 DESC
          LIMIT 100

        # SETUP STYLE
        style:
          position: { x: 16, y: 0, width: 776, height: 280 }
          footer_border_color: "#eee"
          show_title: true
